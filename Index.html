<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorBrawl - PvP Арена</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent: #58a6ff;
            --danger: #f85149;
            --success: #2ea043;
            --text: #c9d1d9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent); font-size: 2.5em; margin-bottom: 5px; }
        
        .mode-selector { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; }
        .mode-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .mode-btn.active { background: var(--accent); color: var(--bg-color); }

        #task-title { color: #fff; margin-bottom: 20px; }

        .arena-container { display: flex; gap: 20px; width: 100%; max-width: 1200px; }
        .player-panel { flex: 1; background: var(--panel-bg); border: 1px solid #30363d; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; }
        
        textarea { width: 100%; height: 300px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; padding: 10px; font-family: monospace; resize: vertical; box-sizing: border-box; }
        
        .controls { margin-top: 30px; text-align: center; width: 100%; }
        button.submit { background: var(--success); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.submit:hover:not(:disabled) { background: #2c974b; }
        button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        #result-box { margin-top: 20px; padding: 20px; background: var(--panel-bg); border: 2px solid var(--accent); border-radius: 8px; display: none; width: 100%; max-width: 800px; line-height: 1.5; }
        .anti-cheat-alert { color: var(--danger); font-weight: bold; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>⚔️ CreatorBrawl</h1>
        <p>Докажи свои навыки. Никакого ИИ. Только чистый скилл.</p>
    </header>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('code', this)">💻 Программирование</button>
        <button class="mode-btn" onclick="setMode('art', this)">🎨 Рисование</button>
        <button class="mode-btn" onclick="setMode('3d', this)">🧊 3D-Моделирование</button>
    </div>

    <h2 id="task-title">Текущая задача: Написать функцию сортировки массива</h2>

    <div class="arena-container">
        <!-- Панель Игрока 1 -->
        <div class="player-panel">
            <div class="player-header">
                <h3>Твоя работа (Игрок 1)</h3>
                <span style="color: var(--accent);" id="p1-status">Ожидание отправки...</span>
            </div>
            <textarea id="player1-input" placeholder="Введи свой код..."></textarea>
            <div id="p1-alert" class="anti-cheat-alert">🚨 Обнаружена генерация нейросетью!</div>
        </div>

        <!-- Панель Игрока 2 (Соперник) -->
        <div class="player-panel">
            <div class="player-header">
                <h3>Соперник (Игрок 2)</h3>
                <span style="color: var(--danger);" id="p2-status">Ожидание...</span>
            </div>
            <textarea id="player2-input" placeholder="Здесь появится работа соперника..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button id="submit-btn" class="submit" onclick="submitWork()">Отправить на оценку судье (ИИ)</button>
    </div>

    <div id="result-box">
        <h3 style="color: var(--accent); margin-top: 0;">🏆 Вердикт ИИ-судьи:</h3>
        <div id="ai-judgment">Анализ...</div>
    </div>

    <script>
        let currentTask = "Написать функцию сортировки массива";

        function setMode(mode, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            if(mode === 'code') currentTask = "Написать функцию сортировки массива";
            if(mode === 'art') currentTask = "Нарисовать пиксель-арт персонажа (вставь ссылку)";
            if(mode === '3d') currentTask = "Спроектировать шестеренку (вставь код OpenSCAD)";
            
            document.getElementById('task-title').innerText = "Текущая задача: " + currentTask;
            document.getElementById('result-box').style.display = 'none';
        }

        async function submitWork() {
            const btn = document.getElementById('submit-btn');
            const p1Input = document.getElementById('player1-input').value;
            const p2Input = document.getElementById('player2-input').value; // Пока берем из второго поля вручную для тестов
            const resultBox = document.getElementById('result-box');
            const judgmentText = document.getElementById('ai-judgment');
            
            if(!p1Input.trim() || !p2Input.trim()) {
                alert("Оба поля (Игрок 1 и Игрок 2) должны быть заполнены!");
                return;
            }

            btn.innerText = "Идет оценка работ...";
            btn.disabled = true;
            resultBox.style.display = 'block';
            judgmentText.innerText = "Судья читает работы...";

            try {
                // Обращаемся к нашему безопасному серверу (Vercel)
                const response = await fetch('/api/judge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        task: currentTask,
                        codeP1: p1Input,
                        codeP2: p2Input
                    })
                });

                if (!response.ok) throw new Error("Ошибка связи с сервером");

                const data = await response.json();
                
                // Выводим ответ, заменяя переносы строк для красоты
                judgmentText.innerHTML = data.verdict.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            } catch (error) {
                judgmentText.innerText = "❌ Ошибка. Убедись, что добавил ключ API в настройки Vercel.";
                console.error(error);
            }

            btn.innerText = "Битва завершена";
            btn.disabled = false;
        }
    </script>
</body>
</html>
